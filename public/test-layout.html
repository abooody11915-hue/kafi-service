<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>RTL Layout Test</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Tajawal:wght@300;400;500;700;800;900&display=swap');
    body {
      font-family: 'Tajawal', 'Cairo', system-ui, sans-serif;
      background: hsl(120 14% 97%);
    }
  </style>
</head>
<body class="min-h-[100dvh] w-full overflow-x-hidden">
  <!-- Header -->
  <header class="sticky top-0 z-50 rounded-b-[20px]" style="background: hsl(155 62% 29%); color: white; padding-top: env(safe-area-inset-top);">
    <div class="flex h-11 items-center justify-between px-3 gap-1.5">
      <!-- Right side — context (RTL primary) -->
      <div class="flex items-center gap-2 flex-1 min-w-0">
        <button class="p-1.5 -mr-1 rounded-lg flex items-center justify-center flex-shrink-0" style="background: rgba(255,255,255,0.1);">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        </button>
        <div class="flex items-center gap-2 min-w-0 flex-1">
          <div class="w-9 h-9 rounded-xl overflow-hidden flex-shrink-0 flex items-center justify-center" style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15);">
            <span style="font-size: 10px; font-weight: 800;">ك</span>
          </div>
          <div class="flex flex-col min-w-0 leading-tight flex-1">
            <div class="flex items-center gap-1 min-w-0">
              <span class="font-bold text-[14.5px] truncate">عمارة الزين</span>
            </div>
          </div>
        </div>
      </div>
      <!-- Left side — actions -->
      <div class="flex items-center gap-0.5 flex-shrink-0">
        <button class="p-2 rounded-lg flex items-center justify-center" style="background: rgba(255,255,255,0.1);">
          <svg xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.1a2 2 0 0 1-1-1.72v-.51a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
        <button class="relative p-2 rounded-lg flex items-center justify-center" style="background: rgba(255,255,255,0.1);">
          <svg xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
          <span class="absolute top-1 left-1 min-w-[15px] h-[15px] text-white text-[9px] font-bold rounded-full flex items-center justify-center px-1" style="background: hsl(4 72% 52%);">3</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main content -->
  <main class="px-4 py-5 pb-[calc(5.5rem+env(safe-area-inset-bottom))] w-full max-w-full" style="min-height: 120vh;">
    <div class="rounded-2xl p-4 mb-4 text-white" style="background: linear-gradient(135deg, hsl(157 60% 20%) 0%, hsl(155 62% 29%) 55%, hsl(158 65% 14%) 100%);">
      <p class="opacity-80 text-sm mb-1">الرصيد الإجمالي</p>
      <p class="text-[28px] font-extrabold">١٢٬٤٥٠ ر.س</p>
    </div>
    <div class="grid grid-cols-2 gap-3">
      <div class="rounded-2xl p-4 bg-white shadow-sm h-24"></div>
      <div class="rounded-2xl p-4 bg-white shadow-sm h-24"></div>
      <div class="rounded-2xl p-4 bg-white shadow-sm h-24"></div>
      <div class="rounded-2xl p-4 bg-white shadow-sm h-24"></div>
    </div>
  </main>

  <!-- Bottom nav -->
  <nav class="fixed bottom-0 inset-x-0 z-50 rounded-t-[20px] border-t" style="
    padding-bottom: env(safe-area-inset-bottom);
    background: linear-gradient(180deg, rgba(255,255,255,0.92) 0%, rgba(255,255,255,0.97) 100%);
    backdrop-filter: blur(28px) saturate(150%);
    -webkit-backdrop-filter: blur(28px) saturate(150%);
    box-shadow: 0 -6px 28px -8px hsl(150 25% 10% / 0.12), inset 0 1px 0 0 rgba(255,255,255,0.8);
    border-color: rgba(255,255,255,0.25);
  ">
    <div class="flex justify-around items-stretch px-2 pt-2 pb-2 gap-1">
      <a href="#" class="relative flex flex-col items-center justify-center gap-1.5 min-w-[56px] py-2 px-2 rounded-2xl text-[11px] font-bold" style="color: hsl(155 62% 29%); background: rgba(255,255,255,0.85); box-shadow: 0 2px 10px -2px rgba(0,0,0,0.08); border: 1px solid rgba(255,255,255,0.9);">
        <svg xmlns="http://www.w3.org/2000/svg" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>
        <span class="leading-none">الرئيسية</span>
      </a>
      <a href="#" class="relative flex flex-col items-center justify-center gap-1.5 min-w-[56px] py-2 px-2 rounded-2xl text-[11px] text-muted-foreground" style="color: hsl(150 8% 42%); background: rgba(255,255,255,0.5);">
        <svg xmlns="http://www.w3.org/2000/svg" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        <span class="leading-none">السكان</span>
      </a>
      <a href="#" class="relative flex flex-col items-center justify-center gap-1.5 min-w-[56px] py-2 px-2 rounded-2xl text-[11px] text-muted-foreground" style="color: hsl(150 8% 42%); background: rgba(255,255,255,0.5);">
        <svg xmlns="http://www.w3.org/2000/svg" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg>
        <span class="leading-none">الفواتير</span>
      </a>
      <a href="#" class="relative flex flex-col items-center justify-center gap-1.5 min-w-[56px] py-2 px-2 rounded-2xl text-[11px] text-muted-foreground" style="color: hsl(150 8% 42%); background: rgba(255,255,255,0.5);">
        <svg xmlns="http://www.w3.org/2000/svg" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0-2 2v4a1 1 0 0 0 1 1h2"/><path d="M21 14v7a1 1 0 0 1-1 1H6a2 2 0 0 1-2-2v-4"/><path d="M3 12V9a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v1"/><path d="M16 3v11"/><path d="M12 7h8"/><path d="M16 14h6"/><path d="M19 17h3"/></svg>
        <span class="leading-none">المالية</span>
      </a>
    </div>
  </nav>
</body>
</html>
